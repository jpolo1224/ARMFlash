[package]
name = "fp-jni"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JNI bridge: the Flashpoint database (flashpoint-archive) and game server for the Android app"

[lib]
name = "fpcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
fp-proxy = { path = "../fp-proxy" }
flashpoint-archive = "0.13.7"
# Same version flashpoint-archive uses (its bundled SQLite), for the one write it has no call for.
rusqlite = "0.30"
jni = "0.21.1"
tokio = { version = "1.54", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Unpacking the Windows runtime (.tar.zst) and support packs (.zip), pure Rust.
ruzstd = "0.8"
tar = "0.4"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[dev-dependencies]
