[package]
name = "fp_ruffle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ARMFlash's native Flash player: Ruffle (wgpu, AAudio) on Android, adapted from ruffle-android"

[lib]
name = "fpruffle"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# Keep symbols here: the APK packaging strips its copy, and the build script saves this one
# under symbols/<commit>/ so a crash from a tester's device can be symbolized.
strip = "none"
debug = "line-tables-only"

[dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.15.1"
jni = "0.22.4"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ndk = { version = "0.9.0", features = ["audio"] }
# counters: wgpu-hal's own object and memory counts, for the memory log.
wgpu = { version = "30.0.1", features = ["counters"] }
# RetroArch (.slangp) shader chains on native Flash (MPL-2.0).
librashader-runtime-wgpu = "0.12.1"
librashader-common = "0.12.1"
librashader-runtime = "0.12.1"
ruffle_common = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master", features = [
    "audio", "symphonia", "mp3", "nellymoser", "lzma", "default_compatibility_rules", "default_font",
] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_video_software = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master" }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle.git", branch = "master", default-features = false, features = ["fs", "navigator", "rustls-tls"] }
log = "0.4.32"
tracing = { version = "0.1.44", features = ["log", "log-always"] }
backtrace = "0.3.76"
async-task = "4.7.1"
url = "2.5.2"
indexmap = "2"
wgpu-hal = { version = "30.0.2", features = ["vulkan"] }
ash = "0.38"
futures = "0.3.34"
async-channel = "2.5.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[workspace]

# Ruffle from the vendored copy (rust/vendor/ruffle), which carries ARMFlash's patches.
[patch."https://github.com/ruffle-rs/ruffle.git"]
asc = { path = "../vendor/ruffle/tools/asc" }
build_playerglobal = { path = "../vendor/ruffle/core/build_playerglobal" }
flv-rs = { path = "../vendor/ruffle/flv" }
naga-agal = { path = "../vendor/ruffle/render/naga-agal" }
naga-pixelbender = { path = "../vendor/ruffle/render/naga-pixelbender" }
pixel_bender = { path = "../vendor/ruffle/render/pixel_bender" }
ruffle_common = { path = "../vendor/ruffle/core/common" }
ruffle_core = { path = "../vendor/ruffle/core" }
ruffle_frontend_utils = { path = "../vendor/ruffle/frontend-utils" }
ruffle_macros = { path = "../vendor/ruffle/core/macros" }
ruffle_render = { path = "../vendor/ruffle/render" }
ruffle_render_wgpu = { path = "../vendor/ruffle/render/wgpu" }
ruffle_video = { path = "../vendor/ruffle/video" }
ruffle_video_software = { path = "../vendor/ruffle/video/software" }
ruffle_wstr = { path = "../vendor/ruffle/wstr" }
swf = { path = "../vendor/ruffle/swf" }
